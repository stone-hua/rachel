<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Nova 智能助手 - 张兆华工作室</title>

    <!-- 引入 Markdown 解析库与 FontAwesome 图标库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        /* --- 全局 CSS 变量 (白天/夜间模式) --- */
        :root {
            --primary: #685cff;
            --primary-gradient: linear-gradient(135deg, #685cff, #c43cff);
            --bg-main: #f8f9ff;
            --bg-card: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #e2e8f0;
            --input-bg: #ffffff;
            --sidebar-width: 280px;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            --bg-main: #121212;
            --bg-card: #1e1e2d;
            --text-main: #e2e8f0;
            --text-sub: #a0aec0;
            --border: #2d3748;
            --input-bg: #1a1a27;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            display: flex;
        }

        /* --- 1. 左侧抽屉式历史会话 --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        @media (min-width: 992px) {
            .sidebar {
                position: relative;
                transform: translateX(0);
            }
            .sidebar.collapsed {
                margin-left: calc(-1 * var(--sidebar-width));
            }
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .btn-new-chat {
            width: 100%;
            padding: 12px;
            border-radius: 24px;
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-new-chat:hover {
            background: var(--primary);
            color: white;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.2s;
        }

        .history-item:hover, .history-item.active {
            background: rgba(104, 92, 255, 0.1);
            color: var(--primary);
        }

        .history-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .history-actions i {
            margin-left: 8px;
            font-size: 12px;
            opacity: 0.6;
        }

        .history-actions i:hover {
            opacity: 1;
        }

        /* 侧边栏底部（含白天/夜间模式切换） */
        .sidebar-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            transition: 0.2s;
        }

        .theme-toggle-btn:hover {
            color: var(--primary);
        }

        /* --- 2. 主页面布局 --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .header {
            height: 55px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-btn {
            font-size: 18px;
            cursor: pointer;
            color: var(--text-main);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            color: transparent;
        }

        .icon-btn {
            cursor: pointer;
            font-size: 18px;
            color: var(--text-sub);
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        /* 对话区 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            -webkit-overflow-scrolling: touch;
        }

        /* 居中 Hero 搜索引擎样式 */
        .welcome-hero {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 20px 0;
        }

        .welcome-hero h1 {
            font-size: 32px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            color: transparent;
        }

        .welcome-hero p {
            color: var(--text-sub);
            font-size: 15px;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            max-width: 90%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .message.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .bubble code {
            background: rgba(0,0,0,0.06);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        /* --- 3. 居中/底部固定容器 (输入框 + 5模式按钮) --- */
        .input-container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 10px 15px 20px 15px;
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
        }

        /* Google/Baidu 大圆角输入框 */
        .input-box-wrapper {
            background: var(--input-bg);
            border-radius: 28px;
            border: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: var(--shadow);
            transition: border-color 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
        }

        textarea.chat-input {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 8px 0;
            max-height: 120px;
            min-height: 24px;
            font-size: 16px; /* 16px 防止 iOS 自动强行放大 */
            font-family: inherit;
            line-height: 1.5;
            background: transparent;
            color: var(--text-main);
        }

        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        /* 5 种 Agent 模式切换按钮 (放置在输入框下方，且两边对齐) */
        .agent-modes {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .mode-chip {
            flex: 1;
            padding: 8px 0;
            border-radius: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .mode-chip {
                font-size: 11px;
                padding: 6px 0;
            }
            .mode-chip i {
                display: none; /* 极小屏下隐藏图标保证文字对齐 */
            }
        }

        .mode-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            font-weight: 600;
        }

        /* 遮罩层 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 90;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* --- 5. 授权码弹窗 (带关闭按钮，无手机号) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: var(--shadow);
        }

        .close-modal {
            position: absolute;
            top: 18px;
            right: 20px;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-sub);
        }

        .form-group {
            margin: 18px 0;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-main);
            font-size: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-tip {
            font-size: 12px;
            color: #e74c3c;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>

<body>

    <!-- 移动端侧边栏遮罩 -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- 1 & 4. 左侧抽屉历史记录 + 夜间/白天模式切换 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="startNewChat()">
                <i class="fas fa-plus"></i> 开启新对话
            </button>
        </div>
        <div class="history-list" id="history-list"></div>
        <div class="sidebar-footer">
            <div class="theme-toggle-btn" onclick="toggleTheme()">
                <i class="fas fa-moon" id="theme-icon"></i>
                <span id="theme-text">夜间模式</span>
            </div>
            <i class="fas fa-trash-alt" title="清空缓存" style="cursor:pointer;" onclick="clearAllCache()"></i>
        </div>
    </div>

    <!-- 2. 主界面 -->
    <div class="main-container">
        <!-- 顶栏 -->
        <div class="header">
            <div class="header-left">
                <i class="fas fa-bars toggle-btn" onclick="toggleSidebar()"></i>
                <div class="logo">AI Nova</div>
            </div>
            <div class="header-actions">
                <i class="fas fa-key icon-btn" title="输入授权码" onclick="openModal('settings-modal')"></i>
            </div>
        </div>

        <!-- 对话展示区（屏幕居中/自然下滑） -->
        <div class="chat-area" id="chat-box">
            <div class="welcome-hero" id="welcome-hero">
                <h1>让 AI 创造更多可能</h1>
                <p>基于智能体网络，帮助您快速完成分析、解答与创作</p>
            </div>
        </div>

        <!-- 3. 居中/底部固定区：输入框 + 5模式两边对齐切换按钮 -->
        <div class="input-container">
            <!-- 输入框 -->
            <div class="input-box-wrapper">
                <textarea id="user_input" class="chat-input" rows="1" placeholder="发送消息给 AI Nova..." oninput="autoResize(this)"></textarea>
                <div class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </div>
            </div>

            <!-- 5 种 Agent 模式切换 (位于输入框下方且两边对齐) -->
            <div class="agent-modes">
                <div class="mode-chip active" data-mode="supervisor" onclick="switchAgentMode('supervisor', this)">
                    <i class="fas fa-user-graduate"></i> 个案督导
                </div>
                <div class="mode-chip" data-mode="simulation" onclick="switchAgentMode('simulation', this)">
                    <i class="fas fa-theater-masks"></i> 咨询陪练
                </div>
                <div class="mode-chip" data-mode="business" onclick="switchAgentMode('business', this)">
                    <i class="fas fa-chart-line"></i> 商业教练
                </div>
                <div class="mode-chip" data-mode="science" onclick="switchAgentMode('science', this)">
                    <i class="fas fa-book-open"></i> 心理科普
                </div>
                <div class="mode-chip" data-mode="free" onclick="switchAgentMode('free', this)">
                    <i class="fas fa-sparkles"></i> 自由创作
                </div>
            </div>
        </div>
    </div>

    <!-- 5. 精简授权码弹窗（带关闭按钮，无手机号） -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('settings-modal')">&times;</span>
            <h3 style="margin-bottom: 5px;">🔑 身份授权</h3>
            <p style="font-size: 13px; color: var(--text-sub);">请输入您的 VIP 授权码以解锁所有 AI 模型服务</p>
            <div class="form-group">
                <label>授权码 (Auth Code)</label>
                <input type="text" id="auth_code" class="form-control" placeholder="请输入您的授权码">
                <div class="auth-tip" id="auth-tip">⚠️ 请先输入有效的授权码才能继续使用！</div>
            </div>
            <button class="btn-submit" onclick="saveConfig()">保存并体验</button>
        </div>
    </div>

    <!-- JavaScript 脚本 -->
    <script>
        /* 预留 API 接口配置与 GitHub 头像路径 */
        const CONFIG = {
            WORKER_URL: 'https://dudao.huaged.com', // 预留 Dify Proxy / Worker 接口
            LOG_URL: 'https://script.google.com/macros/s/AKfycbzPdO5TOYdeKS2W6ZOo5J4rihcYsjyLr3myFK_t0pV6GQp8x-TOMPcIZh_1GqMrSMZo/exec', // Google Sheet 接口
            AI_AVATAR: './avatar.png',   // GitHub 头像相对路径
            USER_AVATAR: './user.png'
        };

        let currentConvId = "";
        let currentMode = "supervisor";
        let chatList = JSON.parse(localStorage.getItem('nova_chat_list')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            renderHistory();
            initTheme();

            document.getElementById('user_input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        /* --- 4. 夜间/白天模式切换逻辑 --- */
        function initTheme() {
            const savedTheme = localStorage.getItem('nova_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeUI(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('nova_theme', newTheme);
            updateThemeUI(newTheme);
        }

        function updateThemeUI(theme) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                icon.className = 'fas fa-sun';
                text.innerText = '白天模式';
            } else {
                icon.className = 'fas fa-moon';
                text.innerText = '夜间模式';
            }
        }

        /* --- 侧边栏与历史记录管理 --- */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = chatList.map(item => `
                <div class="history-item ${item.id === currentConvId ? 'active' : ''}" onclick="loadChat('${item.id}')">
                    <span class="history-title">${item.title}</span>
                    <div class="history-actions">
                        <i class="fas fa-trash" onclick="deleteChat('${item.id}', event)"></i>
                    </div>
                </div>
            `).join('');
        }

        function startNewChat() {
            currentConvId = "";
            document.getElementById('chat-box').innerHTML = `
                <div class="welcome-hero" id="welcome-hero">
                    <h1>让 AI 创造更多可能</h1>
                    <p>基于智能体网络，帮助您快速完成分析、解答与创作</p>
                </div>`;
            closeSidebar();
            renderHistory();
        }

        function loadChat(id) {
            currentConvId = id;
            closeSidebar();
            const msgs = JSON.parse(localStorage.getItem(`nova_msg_${id}`)) || [];
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            msgs.forEach(m => appendMessage(m.role, m.content));
            scrollToBottom();
            renderHistory();
        }

        function saveMsg(id, role, content) {
            let msgs = JSON.parse(localStorage.getItem(`nova_msg_${id}`)) || [];
            msgs.push({ role, content });
            localStorage.setItem(`nova_msg_${id}`, JSON.stringify(msgs));
        }

        function updateChatList(id, firstMsg) {
            const title = firstMsg.substring(0, 12) + "...";
            if (!chatList.find(c => c.id === id)) {
                chatList.unshift({ id, title });
                localStorage.setItem('nova_chat_list', JSON.stringify(chatList));
                renderHistory();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if (!confirm("确认删除此记录？")) return;
            chatList = chatList.filter(c => c.id !== id);
            localStorage.setItem('nova_chat_list', JSON.stringify(chatList));
            localStorage.removeItem(`nova_msg_${id}`);
            renderHistory();
            if (currentConvId === id) startNewChat();
        }

        /* --- 3. 5 种 Agent 模式切换 --- */
        function switchAgentMode(modeKey, el) {
            currentMode = modeKey;
            document.querySelectorAll('.mode-chip').forEach(chip => chip.classList.remove('active'));
            el.classList.add('active');
            
            const input = document.getElementById('user_input');
            const placeholders = {
                supervisor: '输入心理咨询案例或督导需求...',
                simulation: '扮演来访者，请输入第一句话...',
                business: '提出创业获客或变现问题...',
                science: '检索心理学知识或概念...',
                free: '发送消息给 AI Nova...'
            };
            input.placeholder = placeholders[modeKey] || '发送消息...';
        }

        /* --- 6. 授权码验证提醒与 7&8. 消息发送/滚动/手机收起键盘 --- */
        async function sendMessage() {
            const input = document.getElementById('user_input');
            const text = input.value.trim();
            if (!text) return;

            // 6. 验证授权码，若未填写则弹窗提醒引导
            const auth = localStorage.getItem('nova_auth');
            if (!auth) {
                document.getElementById('auth-tip').style.display = 'block';
                openModal('settings-modal');
                return;
            }

            // 8. 手机端发送后：软键盘自动收起，输入框恢复默认高度
            input.blur();
            input.value = '';
            input.style.height = 'auto';

            // 移除居中 Hero
            const hero = document.getElementById('welcome-hero');
            if (hero) hero.remove();

            // 渲染用户消息
            appendMessage('user', text);
            scrollToBottom();

            const loadingId = appendThinking();

            try {
                const payload = {
                    "inputs": { "task_mode": currentMode, "auth_code": auth },
                    "query": text,
                    "response_mode": "blocking",
                    "conversation_id": currentConvId,
                    "user": "user_" + auth.substring(0, 6)
                };

                const response = await fetch(CONFIG.WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                removeThinking(loadingId);

                if (!response.ok) throw new Error("接口响应失败");

                const data = await response.json();
                const aiReply = data.answer || "已收到，但模型未给出有效答复。";

                appendMessage('ai', aiReply);
                
                // 7. 对话自然下滑查阅
                scrollToBottom();

                if (currentConvId !== data.conversation_id) {
                    currentConvId = data.conversation_id || 'conv_' + Date.now();
                    updateChatList(currentConvId, text);
                }
                saveMsg(currentConvId, 'user', text);
                saveMsg(currentConvId, 'ai', aiReply);

            } catch (err) {
                removeThinking(loadingId);
                appendMessage('ai', `❌ 错误: ${err.message} (请检查授权码或 API 网络)`);
                scrollToBottom();
            }
        }

        function appendMessage(role, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const avatarUrl = role === 'ai' ? CONFIG.AI_AVATAR : CONFIG.USER_AVATAR;
            const avatarHtml = `<div class="avatar" style="background-image: url('${avatarUrl}'), url('https://cdn-icons-png.flaticon.com/512/4712/4712035.png');"></div>`;

            div.innerHTML = `
                ${avatarHtml}
                <div class="bubble-content">
                    <div class="bubble">${marked.parse(text)}</div>
                </div>`;

            box.appendChild(div);
        }

        function appendThinking() {
            const id = 'think_' + Date.now();
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar" style="background-image: url('${CONFIG.AI_AVATAR}'), url('https://cdn-icons-png.flaticon.com/512/4712/4712035.png');"></div>
                <div class="bubble"><i class="fas fa-spinner fa-spin"></i> 思考中...</div>`;
            box.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeThinking(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // 7. 对话下滑滚动函数
        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTo({
                top: box.scrollHeight,
                behavior: 'smooth'
            });
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        /* --- 弹窗逻辑 --- */
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveConfig() {
            const auth = document.getElementById('auth_code').value.trim();
            if (!auth) {
                document.getElementById('auth-tip').style.display = 'block';
                return;
            }
            localStorage.setItem('nova_auth', auth);
            document.getElementById('auth-tip').style.display = 'none';
            closeModal('settings-modal');
        }

        function loadConfig() {
            const auth = localStorage.getItem('nova_auth');
            if (auth) document.getElementById('auth_code').value = auth;
        }

        function clearAllCache() {
            if (confirm("确定要清空本地所有聊天记录？")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>

</html>
