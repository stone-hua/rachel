<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Nova 智能助手 </title>

    <!-- 引入 Markdown 解析库与 FontAwesome 图标库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #685cff;
            --primary-gradient: linear-gradient(90deg, #685cff, #c43cff);
            --bg-main: #f8f9ff;
            --white: #ffffff;
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border: #e2e8f0;
            --user-bg: #685cff;
            --ai-bg: #ffffff;
            --sidebar-width: 280px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at top, #ebdfff 0%, transparent 40%), linear-gradient(180deg, #ffffff 0%, var(--bg-main) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            color: var(--text-main);
            display: flex;
            overflow: hidden;
        }

        /* --- 侧边栏 (历史会话) --- */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: absolute;
            left: 0;
            top: 0;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .sidebar.open {
            transform: translateX(0);
        }

        @media (min-width: 992px) {
            .sidebar {
                position: relative;
                transform: translateX(0);
            }
            .sidebar.collapsed {
                margin-left: calc(-1 * var(--sidebar-width));
            }
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border);
        }

        .btn-new-chat {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-new-chat:hover {
            background: var(--primary);
            color: white;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .history-item {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 5px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover, .history-item.active {
            background: #ede9fe;
            color: var(--primary);
        }

        .history-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }

        .history-actions i {
            margin-left: 8px;
            font-size: 12px;
            opacity: 0.6;
        }

        .history-actions i:hover {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
        }

        /* --- 主聊天界面 --- */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* 顶部导航 */
        .header {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toggle-btn {
            font-size: 20px;
            cursor: pointer;
            color: #555;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .icon-btn {
            cursor: pointer;
            font-size: 18px;
            color: #666;
            transition: 0.2s;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        /* 对话展示区域 */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Google/Baidu 式欢迎页 */
        .welcome-hero {
            margin: auto 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .welcome-hero h1 {
            font-size: 36px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            color: transparent;
        }

        .welcome-hero p {
            color: var(--text-sub);
            font-size: 16px;
        }

        /* 消息气泡 */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        /* 头像（预留GitHub与相对路径） */
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            word-break: break-word;
        }

        .message.user .bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background: var(--ai-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        .bubble code {
            background: rgba(0,0,0,0.05);
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
        }

        .bubble pre {
            background: #282c34;
            color: #abb2bf;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .msg-actions {
            margin-top: 5px;
            font-size: 12px;
            color: var(--text-sub);
            display: flex;
            gap: 10px;
        }

        .act-btn {
            cursor: pointer;
        }

        .act-btn:hover {
            color: var(--primary);
        }

        /* --- 底部控制面板与 5 种 Agent 模式切换 --- */
        .input-container {
            padding: 15px 20px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* 5种 Agent 智能体模式卡片/标签栏 */
        .agent-modes {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }

        .agent-modes::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .mode-chip {
            padding: 8px 16px;
            border-radius: 20px;
            background: white;
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .mode-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(104, 92, 255, 0.3);
        }

        /* 类 Google/Baidu 大牌搜索引擎大圆角输入框 */
        .input-box-wrapper {
            background: white;
            border-radius: 28px;
            border: 1px solid var(--border);
            padding: 8px 18px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            transition: border 0.2s, box-shadow 0.2s;
        }

        .input-box-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 8px 28px rgba(104, 92, 255, 0.15);
        }

        textarea.chat-input {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            padding: 8px 0;
            max-height: 120px;
            min-height: 24px;
            font-size: 15px;
            font-family: inherit;
            line-height: 1.5;
            background: transparent;
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
        }

        /* 遮罩层 (移动端) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            z-index: 90;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        /* 极简设置弹窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 16px;
            width: 90%;
            max-width: 450px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 移动端侧边栏遮罩 -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <!-- 1. 左侧历史对话抽屉（代码本地存储逻辑保留） -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="btn-new-chat" onclick="startNewChat()">
                <i class="fas fa-plus"></i> 开启新对话
            </button>
        </div>
        <div class="history-list" id="history-list">
            <!-- 动态渲染历史记录 -->
        </div>
        <div class="sidebar-footer">
            <p style="cursor: pointer;" onclick="clearAllCache()"><i class="fas fa-trash-alt"></i> 清空本地历史缓存</p>
            <p style="margin-top: 5px;">张兆华工作室 © 2025</p>
        </div>
    </div>

    <!-- 2. 主页面区域 -->
    <div class="main-container">
        <!-- 顶栏 -->
        <div class="header">
            <div class="header-left">
                <i class="fas fa-bars toggle-btn" onclick="toggleSidebar()"></i>
                <div class="logo">AI Nova</div>
            </div>
            <div class="header-actions">
                <i class="fas fa-cog icon-btn" title="API与个人设置" onclick="openModal('settings-modal')"></i>
            </div>
        </div>

        <!-- 聊天信息展示区 / 搜索引擎式首页 -->
        <div class="chat-area" id="chat-box">
            <div class="welcome-hero" id="welcome-hero">
                <h1>让 AI 创造更多可能</h1>
                <p>基于先进智能体网络，支持多场景问答、创作与分析</p>
            </div>
        </div>

        <!-- 3. 底部控制区（包含5种Agent模式切换与搜索框） -->
        <div class="input-container">
            <!-- 智能体模式切换（预留5种模式选项） -->
            <div class="agent-modes" id="agent-modes">
                <div class="mode-chip active" data-mode="supervisor" onclick="switchAgentMode('supervisor', this)">
                    <i class="fas fa-user-graduate"></i> 个案督导
                </div>
                <div class="mode-chip" data-mode="simulation" onclick="switchAgentMode('simulation', this)">
                    <i class="fas fa-theater-masks"></i> 咨询陪练
                </div>
                <div class="mode-chip" data-mode="business" onclick="switchAgentMode('business', this)">
                    <i class="fas fa-chart-line"></i> 商业教练
                </div>
                <div class="mode-chip" data-mode="science" onclick="switchAgentMode('science', this)">
                    <i class="fas fa-book-open"></i> 心理科普
                </div>
                <div class="mode-chip" data-mode="free" onclick="switchAgentMode('free', this)">
                    <i class="fas fa-sparkles"></i> 自由创作
                </div>
            </div>

            <!-- 输入框（参考 Google/Baidu 极简风格） -->
            <div class="input-box-wrapper">
                <textarea id="user_input" class="chat-input" rows="1" placeholder="发送消息给 AI Nova..." oninput="autoResize(this)"></textarea>
                <div class="send-btn" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 配置弹窗 (预留 API 设置) -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-bottom: 15px;">⚙️ 节点与系统配置</h3>
            <div class="form-group">
                <label>授权码 (Auth Code)</label>
                <input type="text" id="auth_code" class="form-control" placeholder="请输入您的 VIP 授权码">
            </div>
            <div class="form-group">
                <label>绑定账号 / 手机号</label>
                <input type="text" id="phone_number" class="form-control" placeholder="请输入您的手机号/QQ">
            </div>
            <button class="btn-submit" onclick="saveConfig()">保存设置</button>
        </div>
    </div>

    <!-- JavaScript 核心业务逻辑 -->
    <script>
        /* ================= 5 & 6. 预留 API 接口配置与 GitHub 部署头像路径 ================= */
        const CONFIG = {
            WORKER_URL: 'https://dudao.huaged.com', // 预留 Dify Worker / Cloudflare 接口
            LOG_URL: 'https://script.google.com/macros/s/AKfycbzPdO5TOYdeKS2W6ZOo5J4rihcYsjyLr3myFK_t0pV6GQp8x-TOMPcIZh_1GqMrSMZo/exec', // 预留 Google Sheet 接口
            
            // 预留头像路径（部署到 GitHub 时可将头像放至项目同级根目录下）
            AI_AVATAR: './avatar.png',   // AI 头像相对路径
            USER_AVATAR: './user.png'    // 用户头像相对路径
        };

        let currentConvId = "";
        let currentMode = "supervisor"; // 默认 Agent 模式
        let chatList = JSON.parse(localStorage.getItem('nova_chat_list')) || [];

        // 初始化加载
        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
            renderHistory();
            
            // 绑定键盘 Enter 发送逻辑
            document.getElementById('user_input').addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        });

        /* ================= 侧边栏及历史会话管理 (本地存储) ================= */
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }

        function renderHistory() {
            const listEl = document.getElementById('history-list');
            listEl.innerHTML = chatList.map(item => `
                <div class="history-item ${item.id === currentConvId ? 'active' : ''}" onclick="loadChat('${item.id}')">
                    <span class="history-title">${item.title}</span>
                    <div class="history-actions">
                        <i class="fas fa-pen" onclick="renameChat('${item.id}', event)"></i>
                        <i class="fas fa-trash" onclick="deleteChat('${item.id}', event)"></i>
                    </div>
                </div>
            `).join('');
        }

        function startNewChat() {
            currentConvId = "";
            document.getElementById('chat-box').innerHTML = `
                <div class="welcome-hero" id="welcome-hero">
                    <h1>让 AI 创造更多可能</h1>
                    <p>基于先进智能体网络，支持多场景问答、创作与分析</p>
                </div>`;
            closeSidebar();
            renderHistory();
        }

        function loadChat(id) {
            currentConvId = id;
            closeSidebar();
            const msgs = JSON.parse(localStorage.getItem(`nova_msg_${id}`)) || [];
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            msgs.forEach(m => appendMessage(m.role, m.content, m.msgId));
            renderHistory();
        }

        function saveMsg(id, role, content, msgId) {
            let msgs = JSON.parse(localStorage.getItem(`nova_msg_${id}`)) || [];
            msgs.push({ role, content, msgId });
            localStorage.setItem(`nova_msg_${id}`, JSON.stringify(msgs));
        }

        function updateChatList(id, firstMsg) {
            const title = firstMsg.substring(0, 12) + "...";
            if (!chatList.find(c => c.id === id)) {
                chatList.unshift({ id, title });
                localStorage.setItem('nova_chat_list', JSON.stringify(chatList));
                renderHistory();
            }
        }

        function deleteChat(id, e) {
            e.stopPropagation();
            if (!confirm("确认删除此记录？")) return;
            chatList = chatList.filter(c => c.id !== id);
            localStorage.setItem('nova_chat_list', JSON.stringify(chatList));
            localStorage.removeItem(`nova_msg_${id}`);
            renderHistory();
            if (currentConvId === id) startNewChat();
        }

        function renameChat(id, e) {
            e.stopPropagation();
            const newName = prompt("重命名会话：");
            if (newName) {
                const item = chatList.find(c => c.id === id);
                if (item) {
                    item.title = newName;
                    localStorage.setItem('nova_chat_list', JSON.stringify(chatList));
                    renderHistory();
                }
            }
        }

        function clearAllCache() {
            if (confirm("确定清空本地所有历史记录与配置？")) {
                localStorage.clear();
                location.reload();
            }
        }

        /* ================= 3. 智能体 Agent 模式切换逻辑 ================= */
        function switchAgentMode(modeKey, el) {
            currentMode = modeKey;
            document.querySelectorAll('.mode-chip').forEach(chip => chip.classList.remove('active'));
            el.classList.add('active');
            
            // 提示占位符调整
            const input = document.getElementById('user_input');
            const placeholders = {
                supervisor: '输入心理咨询案例或督导需求...',
                simulation: '开始扮演来访者，请输入您的第一句话...',
                business: '请提出您在创业获客、变现中的难题...',
                science: '请输入想检索的心理学知识概念...',
                free: '发送消息给 AI Nova...'
            };
            input.placeholder = placeholders[modeKey] || '发送消息...';
        }

        /* ================= 消息交互与 API 传输逻辑 ================= */
        async function sendMessage() {
            const input = document.getElementById('user_input');
            const text = input.value.trim();
            if (!text) return;

            // 移除欢迎界面
            const hero = document.getElementById('welcome-hero');
            if (hero) hero.remove();

            // 渲染用户输入
            appendMessage('user', text);
            input.value = '';
            input.style.height = 'auto';

            const auth = localStorage.getItem('nova_auth') || '';
            const phone = localStorage.getItem('nova_phone') || '';

            // 预留 Dify API 交互 Payload 结构
            const payload = {
                "inputs": {
                    "task_mode": currentMode,
                    "auth_code": auth,
                    "phone_number": phone
                },
                "query": text,
                "response_mode": "blocking",
                "conversation_id": currentConvId,
                "user": phone || "anonymous_user"
            };

            const loadingId = appendThinking();

            try {
                // 链接 Dify / Cloudflare 节点网络
                const response = await fetch(CONFIG.WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                removeThinking(loadingId);

                if (!response.ok) throw new Error("服务器响应异常");

                const data = await response.json();
                const aiReply = data.answer || "已收到您的消息，但未返回有效内容。";

                appendMessage('ai', aiReply, data.message_id);

                // 更新会话 ID 与本地持久化
                if (currentConvId !== data.conversation_id) {
                    currentConvId = data.conversation_id || 'conv_' + Date.now();
                    updateChatList(currentConvId, text);
                }
                saveMsg(currentConvId, 'user', text);
                saveMsg(currentConvId, 'ai', aiReply, data.message_id);

                // 预留 Google Sheet 异步数据追踪逻辑
                logToGoogleSheet({ action: 'chat', mode: currentMode, query: text, answer: aiReply });

            } catch (err) {
                removeThinking(loadingId);
                appendMessage('ai', `❌ 传输失败：${err.message} （请检查 API 节点配置）`);
            }
        }

        function appendMessage(role, text, msgId = null) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `message ${role}`;

            // 根据 GitHub 相对路径预留设置头像
            const avatarUrl = role === 'ai' ? CONFIG.AI_AVATAR : CONFIG.USER_AVATAR;
            const avatarHtml = `<div class="avatar" style="background-image: url('${avatarUrl}'), url('https://cdn-icons-png.flaticon.com/512/4712/4712035.png');"></div>`;

            div.innerHTML = `
                ${avatarHtml}
                <div class="bubble-content">
                    <div class="bubble">${marked.parse(text)}</div>
                </div>`;

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function appendThinking() {
            const id = 'think_' + Date.now();
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.id = id;
            div.className = 'message ai';
            div.innerHTML = `
                <div class="avatar" style="background-image: url('${CONFIG.AI_AVATAR}'), url('https://cdn-icons-png.flaticon.com/512/4712/4712035.png');"></div>
                <div class="bubble"><i class="fas fa-spinner fa-spin"></i> 思考中...</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
            return id;
        }

        function removeThinking(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        /* ================= 预留 API / Sheet 追踪接口 ================= */
        function logToGoogleSheet(data) {
            if (!CONFIG.LOG_URL) return;
            fetch(CONFIG.LOG_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(e => console.error("Google Log 错误:", e));
        }

        /* ================= 配置模态框 ================= */
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveConfig() {
            localStorage.setItem('nova_auth', document.getElementById('auth_code').value.trim());
            localStorage.setItem('nova_phone', document.getElementById('phone_number').value.trim());
            closeModal('settings-modal');
            alert("配置保存成功！");
        }

        function loadConfig() {
            if (localStorage.getItem('nova_auth')) document.getElementById('auth_code').value = localStorage.getItem('nova_auth');
            if (localStorage.getItem('nova_phone')) document.getElementById('phone_number').value = localStorage.getItem('nova_phone');
        }
    </script>
</body>

</html>
